# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json

type: map
id: full-page

config:
  mapStyle: "fk2506_gis4dp_base1.json"
  center: [24, -4.1]
  zoom: 4.5

controls:
  navigation:
    enabled: true
    position: bottom-right

layers:
  - id: roads
    type: line
    source:
      type: geojson
      url: "data/drc-roads.json"
    paint:
      line-color: "#7f7f7f"
      line-width: 0.8
      line-opacity: 0.55

  - id: acled-other
    type: circle
    source:
      type: geojson
      url: "data/drc-acled-other.json"
    paint:
      circle-radius: 1.4
      circle-color: "#BE9D5A"
      circle-opacity: 0.55

  - id: acled-roads
    type: circle
    source:
      type: geojson
      url: "data/drc-acled-roads.json"
    paint:
      circle-radius: 1.4
      circle-color: "#A95ABE"
      circle-opacity: 0.55

  - id: acled-within
    type: circle
    source:
      type: geojson
      url: "data/drc-acled-within.json"
    paint:
      circle-radius: 1.7
      circle-color: "#EE4D4D"
      circle-opacity: 0.55

  - id: mineral-facilities
    type: circle
    source:
      type: geojson
      url: "data/drc-mineral-facilities.json"
    paint:
      circle-radius: 4
      circle-color: "#262626"
      circle-stroke-width: 1.2
      circle-stroke-color: "#ffffff"